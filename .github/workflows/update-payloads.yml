name: update-payloads

# Keeps payloads/ in sync with the latest upstream zftpd and MemDBG
# releases, so the kit always serves the newest PS5 payloads without
# manual commits.
on:
  schedule:
    # daily at 04:17 UTC
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/update_payloads.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run payload updater
        run: python3 tools/update_payloads.py

      - name: Commit and push changes
        run: |
          git add -A payloads/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(payloads): update to latest zftpd / MemDBG releases"
            git push
          else
            echo "payloads are up to date, nothing to commit"
          fi
